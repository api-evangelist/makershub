aid: makershub
name: Makershub
description: 'MakersHub is AI-powered accounts payable (AP) automation software built
  for the physical economy — construction, manufacturing, distribution, and trade
  services businesses with high bill volume, job costing, and multi-entity operations.
  Its WiseVision AI engine captures bills from any source and extracts 35+ fields
  per invoice including line items, then automates GL coding, approval routing, purchase-order
  (2- and 3-way) matching, and payment, syncing clean structured data in-house to
  QuickBooks, NetSuite, Sage Intacct, and Xero. It also serves accounting firms, hospitality,
  healthcare, nonprofits, real estate, and retail & wholesale, supports US and Canadian
  multi-rate tax codes, and is SOC 2 Type II certified.'
